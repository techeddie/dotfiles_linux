# ---------------HYPRLAND CONFIG EDDIE---------------------

################
### MONITORS ###
################

# eDP-1 = Notebook, HDMI-2 = external
monitor = HDMI-A-2, 2560x1440@59.95, 0x0, 1
# monitor = HDMI-A-2, 1920x1080@120, 0x0, 1
monitor = eDP-1, 1920x1080@60, 2560x0, 1
monitor = , preferred, auto, 1

#####################
### ENVIRONMENT  ####
#####################

env = XCURSOR_SIZE, 28
# env = XCURSOR_THEME, breeze_cursors
env = XCURSOR_THEME, Breeze_Light
env = HYPRCURSOR_THEME, Breeze_Light
env = HYPRCURSOR_SIZE, 28
env = QT_QPA_PLATFORM, wayland
env = SDL_VIDEODRIVER, wayland
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland

################
### AUTOSTART ##
################

# exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# exec-once = autokey-gtk
# exec-once = kitty --class floating-term -e tmux new-session -A -s scratchpad
exec-once = blueman-applet
exec-once = brave
exec-once = swaync
# exec-once = dunst
exec-once = env QT_QPA_PLATFORM=wayland copyq
exec-once = gnome-disks
exec-once = hypridle
exec-once = hyprpaper
exec-once = keepassxc
exec-once = kitty --class floating-term
exec-once = kitty -e sh -c tmux
exec-once = [workspace 1] kitty
exec-once = nm-applet --indicator
exec-once = obsidian
exec-once = seafile-applet
exec-once = subl
exec-once = waybar 2>/dev/null
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-paste --type text --watch cliphist store


# runs on every reload (exec_always equivalent)
# exec = /usr/bin/autokey-gtk

#####################
### LOOK AND FEEL ###
#####################

general {
    # gaps_in = 15
    # gaps_out = 5
    border_size = 1
    # col.active_border = rgb(6790EB)
    # col.inactive_border = rgb(222222)
    # resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.8

    # shadow {
    #     enabled = true
    #     range = 7
    #     render_power = 2
    #     color = rgba(00000080)
    #     offset = -7 -7
    # }

    blur {
        enabled = true
    }
}

animations {
    enabled = false

    # Bezier curves (easing functions)
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05    # overshoot
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = easeOut, 0.0, 0.0, 0.2, 1.0
    bezier = easeInOut, 0.4, 0.0, 0.2, 1.0

    # Windows
    animation = windows, 1, 7, myBezier         # open/close
    animation = windowsOut, 1, 7, easeOut, popin 80%
    animation = windowsMove, 1, 5, easeInOut     # drag/move

    # Fade
    animation = fade, 1, 5, easeOut             # opacity transitions
    animation = fadeOut, 1, 5, easeOut

    # Workspaces
      animation = workspaces, 0, 9, linear
    # animation = workspaces, 1, 6, easeInOut, slide      # slide links/rechts
    # animation = workspaces, 1, 6, easeInOut, slidevert # slide oben/unten
    # animation = workspaces, 1, 10, myBezier, fade       # fade


    # Special workspace (scratchpad)
    animation = specialWorkspace, 1, 6, easeInOut, slidevert
}

dwindle {
    # pseudotile = false
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    # new_window_takes_over_fullscreen = 2
}

#############
### INPUT ###
#############

input {
    repeat_delay = 250
    repeat_rate = 40
    follow_mouse = 1
    sensitivity = 0
    numlock_by_default = true

    kb_layout = de
    kb_variant = us
    kb_options = nodeadkeys

    touchpad {
        natural_scroll = false
        tap-to-click = true
    }
}

device {
    name = sinowealth-gxt-144-gaming-mouse  # lowercase, spaces → hyphens
    accel_profile = adaptive
    sensitivity = -0.8

    # accel_profile = flat
    # sensitivity = -0.4  # -1.0 to 1.0
    # sensitivity = -0.8
}

device {
    name = sino-wealth-peripad-506-touchpad
    accel_profile = adaptive
    sensitivity = -0.5

    natural_scroll = false
    tap-to-click = true
    scroll_factor = 0.1  # smaller = slower scrolling; closest equivalent to ScrollingPixelDistance
}

# gestures {
#     workspace_swipe = true
# }

####################
### WORKSPACES   ###
####################

workspace = 1, monitor:HDMI-A-2
workspace = 2, monitor:HDMI-A-2
workspace = 3, monitor:HDMI-A-2
workspace = 4, monitor:HDMI-A-2
workspace = 5, monitor:HDMI-A-2
workspace = 6, monitor:HDMI-A-2
workspace = 7, monitor:HDMI-A-2
workspace = 8, monitor:HDMI-A-2
workspace = 9, monitor:HDMI-A-2
workspace = 10, monitor:eDP-1

####################
### WINDOW RULES ###
####################

windowrule {
    name = fuzzel-no-anim
    match:class = fuzzel
    animation = off
}

windowrule {
    name = copyq-float
    match:class = com.github.hluk.copyq
    float = on
    center = on
    size = 600 400
}

windowrule {
    name = brave-workspace-class
    match:class = brave-browser
    workspace = 2
}

windowrule {
    name = keepassxc-scratchpad
    match:class = org.keepassxc.KeePassXC
    workspace = special:keepassxc silent
    float = on
    center = on
}

windowrule {
    name = sublime-scratchpad
    match:class = sublime_text
    workspace = special:sublime
    float = on
    center = on
}

windowrule {
    name = doublecmd-scratchpad
    match:class = Doublecmd
    workspace = special:doublecmd
    float = on
    center = on
}

windowrule {
    name = obsidian-workspace
    match:class = obsidian
    workspace = 3
}

windowrule {
    name = floating-term
    match:class = floating-term
    workspace = special:floating-term
    float = on
    center = on
    size = 1200 600
}

windowrule {
    name = gnome-disks
    match:class = org.gnome.DiskUtility
    workspace = special:disks
    float = on
    center = on
}

windowrule {
    name = mpv-fullscreen
    match:class = mpv
    fullscreen = on
}

windowrule {
    name = resources-float
    match:class = net.nokyan.Resources
    float = on
    size = 1200 900
    center = on
}

windowrule {
    name = calculator-float
    match:class = Gnome-calculator
    float = on
    center = on
}

windowrule {
    name = virt-manager-float
    match:class = Virt-manager
    float = on
}

windowrule {
    name = filechooser-float
    match:title = GtkFileChooserDialog
    float = on
    size = 800 600
    center = on
}

windowrule {
    name = thunar-progress-float
    match:title = Copying files to|Copying|Deleting|Moving|Packing
    float = on
}



#################
### VARIABLES ###
#################

$mod = SUPER
$alt = ALT
$term = kitty
$scripts = ~/.config/hypr/scripts

#################
### KEYBINDINGS #
#################

# --- Terminal ---
bind = $mod, Return, exec, $term

# --- Kill window ---
bind = $mod, Q, killactive
bind = $mod, Escape, exec, hyprctl kill

# --- Fullscreen ---
bind = $mod, F, fullscreen, 0

# --- Floating toggle ---
bind = $mod, T, togglefloating

# --- Split direction (dwindle) ---
bind = $mod, H, layoutmsg, togglesplit
bind = $mod, V, layoutmsg, togglesplit

# --- Focus windows ---
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u

# --- Move windows ---
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod $alt, H, movewindow, l
bind = $mod $alt, J, movewindow, d
bind = $mod $alt, K, movewindow, u
bind = $mod $alt, L, movewindow, r

# --- Resize windows ---
bind = $mod $alt, left, resizeactive, -60 0
bind = $mod $alt, right, resizeactive, 60 0
bind = $mod $alt, up, resizeactive, 0 -60
bind = $mod $alt, down, resizeactive, 0 60

# --- Mouse drag/resize ---
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- Workspace switching ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, Return, workspace, 1

# --- Move container to workspace ---
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# --- Workspace navigation ---
bind = ALT CTRL, J, workspace, e-1
bind = ALT CTRL, K, workspace, e+1
bind = $mod, Next, workspace, e+1
bind = $mod, Prior, workspace, e-1
bind = $mod SHIFT, End, workspace, e+1
bind = $mod SHIFT, Home, workspace, e-1
bind = $mod SHIFT, J, workspace, e-1
bind = $mod SHIFT, K, workspace, e+1
bind = ALT, Tab, workspace, previous

# --- Alt-tab (cycle windows) ---
bind = $mod, Tab, cyclenext
bind = $mod SHIFT, Tab, cyclenext, prev

# --- Scratchpad (generic) ---
bind = $mod, Z, movetoworkspacesilent, special
bind = $mod, Y, movetoworkspacesilent, special
bind = $mod, U, togglespecialworkspace

# --- Named scratchpads ---
bind = , F12, exec, ~/.config/hypr/scripts/floating-term.sh

bind = $mod, grave, togglespecialworkspace, keepassxc
bind = $mod, A, togglespecialworkspace, keepassxc
bind = $mod SHIFT, G, togglespecialworkspace, disks
bind = $mod, G, togglespecialworkspace, sublime
bind = $mod, Delete, togglespecialworkspace, sublime
bind = $mod, D, togglespecialworkspace, doublecmd

# --- Gaps toggle ---
bind = $mod, F1, exec, hyprctl keyword general:gaps_in 0 && hyprctl keyword general:gaps_out 0
bind = $mod, F2, exec, hyprctl keyword general:gaps_in 5 && hyprctl keyword general:gaps_out 5
bind = $mod, F3, exec, hyprctl keyword general:gaps_in 20 && hyprctl keyword general:gaps_out 40
bind = $mod, F4, exec, hyprctl keyword general:gaps_in 40 && hyprctl keyword general:gaps_out 60

# --- Lockscreen / suspend ---
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, S, exec, systemctl suspend

# --- Logout / shutdown ---
bind = $mod, X, exec, wlogout
bind = $mod SHIFT, X, exec, systemctl poweroff

# --- Reload config ---
bind = $mod SHIFT, R, exec, hyprctl reload && notify-send -t 2500 -i preferences-system "Hyprland" "config reloaded"
bind = $mod, R, exec, hyprctl reload

# --- Keyboard layout toggle ---
bind = $mod, space, exec, sh ~/scripts/runToggleKeyboardLayout.sh

# --- Waybar restart and toggle ---
bind = $mod, P, exec, killall -SIGUSR1 waybar
bind = $alt SHIFT, P, exec, killall waybar && waybar &

# --- Exit current hyprland session ---
bind = $mod, x, exec, hyprctl dispatch exit

# --- Application launchers ---
bind = $mod $alt CTRL, C,    exec, hyprctl clients -j | grep -q '"class": "Chromium"'        && hyprctl dispatch focuswindow class:Chromium         || chromium
bind = $mod $alt CTRL, L,    exec, hyprctl clients -j | grep -q '"class": "ledger-live"'     && hyprctl dispatch focuswindow class:ledger-live      || ledger-live-desktop
bind = $mod $alt CTRL, M,    exec, hyprctl clients -j | grep -q '"class": "mpv"'             && hyprctl dispatch focuswindow class:mpv              || mpv --player-operation-mode=pseudo-gui
bind = $mod $alt CTRL, T,    exec, hyprctl clients -j | grep -q '"class": "Telegram"'        && hyprctl dispatch focuswindow class:Telegram         || Telegram
bind = $mod $alt, C,         exec, hyprctl clients -j | grep -q '"class": "elecwhat"'        && hyprctl dispatch focuswindow class:elecwhat         || elecwhat
bind = $mod SHIFT, B,        exec, hyprctl clients -j | grep -q '"class": "blueman-manager"' && hyprctl dispatch focuswindow class:blueman-manager || blueman-manager
bind = $mod SHIFT, C,        exec, hyprctl clients -j | grep -q '"class": "Chromium"'        && hyprctl dispatch focuswindow class:Chromium         || chromium
bind = $mod SHIFT, F,        exec, hyprctl clients -j | grep -q '"class": "floorp"'          && hyprctl dispatch focuswindow class:floorp           || floorp
bind = $mod SHIFT, V,        exec, hyprctl clients -j | grep -q '"class": "vlc"'             && hyprctl dispatch focuswindow class:vlc              || vlc
bind = $mod, B,              exec, hyprctl clients -j | grep -q '"class": "brave-browser"'  && hyprctl dispatch focuswindow class:brave-browser  || brave
bind = $mod, C,              exec, hyprctl clients -j | grep -q '"class": "Chromium"'        && hyprctl dispatch focuswindow class:Chromium         || chromium
# bind = $mod, D,              exec, hyprctl clients -j | grep -q '"class": "Doublecmd"'       && hyprctl dispatch focuswindow class:Doublecmd        || ~/opt/_APP_IMAGES/doublecmd/doublecmd-gtk-latest-x86_64.AppImage
bind = $mod, E,              exec, hyprctl clients -j | grep -q '"class": "thunar"'         && hyprctl dispatch focuswindow class:thunar         || thunar
bind = $mod, N,              exec, hyprctl clients -j | grep -q '"class": "obsidian"'        && hyprctl dispatch focuswindow class:obsidian        || obsidian
bind = $mod, O,              exec, hyprctl clients -j | grep -q '"class": "Thunderbird"'     && hyprctl dispatch focuswindow class:Thunderbird      || thunderbird
bind = CTRL $alt, M,         exec, hyprctl clients -j | grep -q '"class": "pavucontrol"'    && hyprctl dispatch focuswindow class:pavucontrol    || pavucontrol
bind = CTRL SHIFT, Escape,   exec, /usr/bin/flatpak run --branch=stable --arch=x86_64 --command=resources net.nokyan.Resources

bind = $mod SHIFT, F11, exec, $term --class sp-backup.root -e doas bash /home/eddie/scripts/btrfs/root/backup.root.sh
bind = $mod SHIFT, F12, exec, $term --class sp-backup.home -e doas bash /home/eddie/scripts/btrfs/home/backup.home_auto.sh
bind = $mod SHIFT, L, exec, kitty -e lf ~/
bind = $mod SHIFT, P, exec, kitty -e pacseek
bind = $mod SHIFT, U, exec, sh ~/scripts/runRemoveUSB.sh
bind = $mod SHIFT, Z, exec, sh ~/scripts/runTogglePowerMode.sh
bind = $mod, F10, exec, sh ~/config/rdp/HZ-DC01
bind = $mod, F11, exec, sh ~/config/rdp/HZ-EX02.sh
bind = $mod, F12, exec, sh ~/config/rdp/HZ-APP02.sh
bind = $mod, F5, exec, sh ~/scripts/runHDMI_ONLY.sh
bind = $mod, F6, exec, sh ~/scripts/runHDMI_OFF.sh
bind = $mod, F7, exec, sh ~/scripts/runHDMI_AND_NOTEBOOK.sh
bind = $mod, F8, exec, sh ~/scripts/restic/restic_runBackupS3.sh
bind = $mod, F9, exec, sh ~/scripts/restic/restic_ALL.sh

# --- CLipboard Manager ---
# bind = $mod, j, exec, copyq toggle
# bind = , F1, exec, copyq toggle

# bind = , F1, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy && wtype -M ctrl -P v -p v -m ctrl
# bind = $mod, J, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy && wtype -M ctrl -P v -p v -m ctrl

# bind = , F1, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy && wtype -M ctrl -P v -p v -m ctrl
# bind = $mod, J, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy && wtype -M ctrl -P v -p v -m ctrl

# bind = , F1, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy && sleep 0.1 && wtype -M ctrl -P v -p v -m ctrl
bind = , F1, exec, cliphist list | rofi -dmenu -theme gruvbox-dark-hard | cliphist decode | wl-copy && sleep 0.1 && wtype -M ctrl -P v -p v -m ctrl

# --- Rofi ---
bind = $mod, W, exec, rofi -combi-modi window -show combi -show-icons -theme gruvbox-dark-hard
bind = $mod, M, exec, rofi -combi-modi window -show drun -show-icons -theme gruvbox-dark-hard
bind = $mod SHIFT, M, exec, sh ~/gitREPO/dotfiles_linux/hyprland/scripts/rofi.pkill.sh

# --- CPU performance profiles ---
bind = $mod SHIFT, F1, exec, sudo cpupower frequency-set -u 800MHz && notify-send 'CPU' 'Powersave (800MHz)'
bind = $mod SHIFT, F2, exec, sudo auto-cpufreq --force=reset && sudo cpupower frequency-set -u 800MHz && notify-send 'CPU' 'Auto'
bind = $mod SHIFT, F3, exec, sudo cpupower frequency-set -u 2300MHz && notify-send 'CPU' 'Balanced (2300MHz)'
bind = $mod SHIFT, F4, exec, sudo cpupower frequency-set -u 4600MHz && notify-send 'CPU' 'Performance (4600MHz)'

# --- Screenshots (grim + slurp, Wayland replacements for maim + xclip) ---
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod, Print, exec, bash -c 'grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/screenshot_$(date +%Y%m%d_%H%M%S).png | wl-copy'
bind = $mod SHIFT, Print, exec, bash -c 'grim - | tee ~/Pictures/Screenshots/screenshot_$(date +%Y%m%d_%H%M%S).png | wl-copy'

# --- Audio ---
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +2%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -2%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop

# --- Brightness (brightnessctl replaces xbacklight) ---
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
