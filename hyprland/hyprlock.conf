background {
    monitor =
    path = ~/opt/WALLPAPER_FS01/ARCH-LINUX/1056796-arch-linux-wallpaper-1920x1200-ipad.jpg
    blur_passes = 3
    blur_size = 3
    brightness = 0.6
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgba(235, 219, 178, 1.0)   # gruvbox fg
    font_size = 72
    font_family = Noto Sans Bold
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d. %B %Y")"
    color = rgba(168, 153, 132, 1.0)   # gruvbox gray
    font_size = 20
    font_family = Noto Sans
    position = 0, 120
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 320 55
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    outer_color = rgba(104, 157, 106, 1.0)   # gruvbox green
    inner_color = rgba(40, 40, 40, 0.9)       # gruvbox bg
    font_color = rgba(235, 219, 178, 1.0)     # gruvbox fg
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    check_color = rgba(184, 187, 38, 1.0)     # gruvbox yellow
    fail_color = rgba(204, 36, 29, 1.0)       # gruvbox red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -100
    halign = center
    valign = center
}
