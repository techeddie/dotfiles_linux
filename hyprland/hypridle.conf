# hypridle config — replaces xss-lock + xautolock from i3

general {
    lock_cmd = hyprlock
    before_sleep_cmd = hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# notify 30 seconds before locking
listener {
    timeout = 570
    on-timeout = notify-send -t 15000 --icon=dialog-information "Screen" "locking screen in 30 seconds"
}

# lock after 3 minutes 
listener {
    timeout = 180
    on-timeout = hyprlock
}

# turn off display after 10 minutes
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
