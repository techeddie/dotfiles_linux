# backend — use glx for best compatibility
backend = "glx";

# minimal fade animation
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;
no-fading-destroyed-argb = true;

# disable shadows
shadow = false;

# disable blur
blur-method = "none";

# vsync to prevent screen tearing
vsync = true;

# rounded corners for all windows
corner-radius = 10;

# exclude bars and dunst (dunst handles its own corners)
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'i3bar'",
  "class_g = 'Dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# transparency — disable
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
